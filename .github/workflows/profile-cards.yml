name: Refresh profile cards

on:
  schedule:
    - cron: "23 1 * * *"   # daily, 01:23 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/**", "fonts/**", "assets/**", ".github/workflows/profile-cards.yml"]

permissions:
  contents: write

concurrency:
  group: profile-cards
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Fetch contribution data
        env:
          # Optional: a fine-grained PAT in CONTRIB_TOKEN; the workflow token covers public data.
          GITHUB_TOKEN: ${{ secrets.CONTRIB_TOKEN || github.token }}
          GITHUB_LOGIN: ${{ github.repository_owner }}
        run: python scripts/fetch_data.py

      - name: Render cards
        run: python scripts/render_cards.py

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/contributions.json cards
          if git diff --cached --quiet; then
            echo "Cards unchanged."
          else
            git commit -m "chore: refresh profile cards"
            git push
          fi
